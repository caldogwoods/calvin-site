name: Deploy to GitHub Pages

# Builds the site and publishes it to the gh-pages branch on every push to
# master, including commits made in GitHub's web editor. Can also be run by
# hand from the Actions tab.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# If two pushes happen close together, only the newest one deploys
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_ADMIN_USER_IDS: ${{ secrets.REACT_APP_ADMIN_USER_IDS }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
